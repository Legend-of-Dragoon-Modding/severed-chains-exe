name: Build .NET 4.8 Application

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore SeveredChainsLaunch\SeveredChainsLaunch.sln

    - name: Build Solution
      run: msbuild SeveredChainsLaunch\SeveredChainsLaunch.sln /p:Configuration=Release /p:TargetFrameworkVersion=v4.8

    - name: Upload Release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: 'true'
        artifacts: 'SeveredChainsLaunch\SeveredChainsLaunch\bin\Release\Severed Chains.exe'
        commit: ${{ github.sha }}
        draft: 'false'
        generateReleaseNotes: 'false'
        name: 'Executable'
        prerelease: 'false'
        tag: 'release'
        token: ${{ secrets.GITHUB_TOKEN }}
